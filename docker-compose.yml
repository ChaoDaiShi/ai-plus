services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: insightx
      POSTGRES_PASSWORD: insightx
      POSTGRES_DB: insightx
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insightx"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./backend
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    environment:
      # Demo/dev 栈：预置身份与演示数据集仅在该模式下可用（生产拒绝，见
      # app.api.deps / app.agent.providers.reviews）。
      APP_ENV: dev
      DATABASE_URL: postgresql+asyncpg://insightx:insightx@postgres:5432/insightx
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql+asyncpg://insightx:insightx@postgres:5432/insightx
      AMAZON_PROVIDER: demo
      EMBEDDING_PROVIDER: deterministic
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  seed:
    build: ./backend
    command: ["uv", "run", "--no-sync", "python", "-m", "app.db.seed_dev"]
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql+asyncpg://insightx:insightx@postgres:5432/insightx
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: ./backend
    command: ["uv", "run", "--no-sync", "python", "-m", "app.worker"]
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql+asyncpg://insightx:insightx@postgres:5432/insightx
      AMAZON_PROVIDER: demo
      EMBEDDING_PROVIDER: deterministic
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

volumes:
  pgdata:
